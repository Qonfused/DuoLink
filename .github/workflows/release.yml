name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: DuoLink-*
          path: dist
          merge-multiple: true

      - name: Verify tag and package checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for build_type in RELEASE DEBUG; do
            test -f "dist/DuoLink-$version-$build_type.zip"
          done
          cd dist
          cat ./*.zip.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "DuoLink ${GITHUB_REF_NAME#v}" \
            dist/DuoLink-*-RELEASE.zip dist/DuoLink-*-DEBUG.zip dist/SHA256SUMS
